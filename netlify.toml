[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  included_files = ["data/**"]

[[redirects]]
  from = "/api/market/*"
  to = "/.netlify/functions/market"
  status = 200

[[redirects]]
  from = "/api/next-candle/*"
  to = "/.netlify/functions/next-candle"
  status = 200

[[redirects]]
  from = "/api/monitor/*"
  to = "/.netlify/functions/monitor"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
